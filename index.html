<!DOCTYPE html>
<html>
<head>
    <title>Prakash Restaurant</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="overlay">
<div class="container">

    <!-- REGISTER SECTION -->
    <div id="registerSection" class="card">
        <h2>Create Account</h2>
        <input type="text" id="regName" placeholder="Full Name">
        <input type="email" id="regEmail" placeholder="Email">
        <input type="password" id="regPassword" placeholder="Password">
        <button id="registerBtn">Register</button>
        <p id="registerMessage"></p>
        <p class="switch">Already have account? <span id="goLogin">Login</span></p>
    </div>

    <!-- LOGIN SECTION -->
    <div id="loginSection" class="card" style="display:none;">
        <h2>Welcome Back</h2>
        <input type="email" id="loginEmail" placeholder="Email">
        <input type="password" id="loginPassword" placeholder="Password">
        <button id="loginBtn">Login</button>
        <p id="loginMessage"></p>
    </div>

    <!-- BOOKING SECTION -->
    <div id="bookingSection" class="card" style="display:none;">
        <h2>Reserve a Table</h2>

        <form id="bookingForm">
            <input type="text" id="name" placeholder="Full Name" required>
            <input type="number" id="age" placeholder="Age" required>
            <input type="text" id="address" placeholder="Address" required>
            <input type="email" id="email" placeholder="Email" required>
            <input type="date" id="date" required>
            <input type="time" id="time" required>
            <button type="submit">Book Now</button>
            <p id="bookingMessage"></p>
        </form>
    </div>
